name: Keep Supabase alive

# Supabase pauses free-tier projects after ~7 days without database activity.
# This workflow makes a real database query twice a week so the project is
# never idle long enough to be paused. If Supabase becomes unreachable
# (e.g. the project got paused anyway), the run fails and GitHub emails you.

on:
  schedule:
    # Mondays and Thursdays at 06:17 UTC (odd minute to avoid the top-of-hour rush)
    - cron: '17 6 * * 1,4'
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        run: |
          # The anon key is the public client-side key already shipped in the app bundle.
          SUPABASE_URL="https://dgznrvltugmzacsdykfh.supabase.co"
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnem5ydmx0dWdtemFjc2R5a2ZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTczMDU3MzQsImV4cCI6MjA3Mjg4MTczNH0.Lfe4eZliQe3aIwvirOFQn15U1XFpzkwWogm9-XjwdLg"

          status=$(curl -sS -o /tmp/body.txt -w "%{http_code}" --max-time 30 \
            "$SUPABASE_URL/rest/v1/families?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" || echo "000")

          echo "HTTP status: $status"
          cat /tmp/body.txt || true

          # Any 2xx/4xx means the request reached the database (RLS may hide rows,
          # which is fine — the query still counts as activity). 000 means DNS/
          # connection failure, i.e. the project is likely paused.
          if [ "$status" = "000" ] || [ "$status" -ge 500 ]; then
            echo "::error::Supabase project unreachable — it may be paused. Restore it at https://supabase.com/dashboard"
            exit 1
          fi

      - name: Keep this scheduled workflow enabled
        # GitHub disables cron workflows in repos with no activity for 60 days.
        # Re-enabling the workflow via the API resets that timer, so this keeps
        # running even when the repo sits untouched between Christmas seasons.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/keep-supabase-alive.yml/enable"
