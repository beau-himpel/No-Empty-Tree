<div class="wish-item" [class.adopted]="item().is_adopted">
  <app-item-info [item]="item()" />
  <div class="item-actions">
    @if (item().is_adopted) {
    <div class="adopted-info">
      <div class="adopted-by">
        Adopted by
        {{ (item().adopted_by_name || item().adopted_by) | titlecase }}
      </div>
      @if (isAdoptedByCurrentUser()) {
      <button
        class="bg-white hover:bg-red-50 text-red-500 border border-red-500 font-medium py-2 px-4 rounded-lg flex items-center gap-2 transition-colors"
        (click)="onUnadoptItem()"
      >
        <div class="flex items-center justify-center w-full gap-4">
          <span>Unadopt</span>
          <i class="pi pi-undo"></i>
        </div>
      </button>
      }
    </div>
    } @else {
    <button
      class="bg-red-500 hover:bg-red-600 text-white font-medium py-2 px-4 rounded-lg flex items-center gap-2 transition-colors"
      (click)="onAdoptItem()"
    >
      <div class="flex items-center gap-4">
        <span>Adopt</span>
        <i class="pi pi-heart-fill"></i>
      </div>
    </button>
    }
  </div>
</div>
