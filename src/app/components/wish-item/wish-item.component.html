<div
  class="flex flex-col gap-3 py-4 sm:flex-row sm:items-center sm:justify-between sm:gap-6"
>
  <app-item-info [item]="item()" [class.opacity-60]="item().is_adopted" />

  <div class="flex shrink-0 flex-col items-stretch gap-2 sm:items-end">
    @if (item().is_adopted) {
    <span
      class="inline-flex items-center justify-center gap-1.5 text-xs font-semibold text-pine-700"
    >
      <i class="pi pi-check-circle" aria-hidden="true"></i>
      Adopted by {{ item().adopted_by_name?.full_name | titlecase }}
    </span>
    @if (isAdoptedByCurrentUser()) {
    <button
      type="button"
      class="btn-unadopt"
      (click)="showUnadoptConfirmationModal.set(true)"
    >
      <i class="pi pi-undo" aria-hidden="true"></i>
      Unadopt
    </button>
    } } @else {
    <button type="button" class="btn-adopt" (click)="adoptItem.emit()">
      <i class="pi pi-heart-fill" aria-hidden="true"></i>
      Adopt
    </button>
    }
  </div>
</div>

<p-dialog
  header="Unadopt this gift?"
  [(visible)]="showUnadoptConfirmationModal"
  [modal]="true"
  [closable]="false"
  [style]="{ width: '92vw', maxWidth: '26rem' }"
  [draggable]="false"
  [resizable]="false"
  [appendTo]="'body'"
>
  <p>
    This wish list item will become available for someone else to adopt.
  </p>

  <ng-template pTemplate="footer">
    <div class="flex w-full flex-col-reverse gap-2 sm:flex-row sm:justify-end">
      <button
        type="button"
        class="btn-outline"
        (click)="showUnadoptConfirmationModal.set(false)"
      >
        Cancel
      </button>
      <button type="button" class="btn-unadopt" (click)="confirmUnadopt()">
        <i class="pi pi-undo" aria-hidden="true"></i>
        Yes, unadopt
      </button>
    </div>
  </ng-template>
</p-dialog>
