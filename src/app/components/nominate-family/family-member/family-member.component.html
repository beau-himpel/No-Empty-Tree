<div class="mb-8">
  <div class="member-content">
    @if (showMemberDetails()) {
      <app-member-details
        [member]="member"
        (memberUpdated)="onMemberUpdated($event)"
      >
      </app-member-details>
      
      <div class="member-actions">
        <button
          class="add-items-btn"
          (click)="addWishListItems()"
        >
          <i class="pi pi-plus"></i>
          <span>Add wish list items</span>
        </button>
      </div>
    } @else {
      <app-item-form
        [memberName]="member.name"
        [existingItems]="member.items"
        (itemsSaved)="onItemsSaved($event)"
        (itemsUpdated)="onItemsUpdated($event)"
        (doneAddingItems)="onDoneAddingItems()"
        (editMemberDetails)="onEditMemberDetails()"
      >
      </app-item-form>
    }

    <div class="member-footer">
      <button
        class="delete-member-btn"
        (click)="deleteMember()"
      >
        <i class="pi pi-trash"></i>
        <span>Delete family member</span>
      </button>
    </div>
  </div>
</div>

<p-dialog
  header="Confirm removing family member"
  [(visible)]="showConfirmationModal"
  [modal]="true"
  [closable]="false"
  [style]="{ width: '450px' }"
  [draggable]="false"
  [resizable]="false"
>
  <div class="confirmation-content">
    <p>
      Are you sure you want to delete this family member and all associated wish
      list items?
    </p>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-8">
      <button class="cancel-btn" (click)="cancelDeleteMember()">Cancel</button>
      <button class="confirm-btn" (click)="confirmDeleteMember()">
        <div class="flex items-center gap-4">
          <span>Delete</span>
          <i class="pi pi-heart-fill"></i>
        </div>
      </button>
    </div>
  </ng-template>
</p-dialog>
