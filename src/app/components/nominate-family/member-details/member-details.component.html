<div>
  <button
    type="button"
    class="group flex w-full items-center gap-3 py-4 text-left focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pine-600"
    (click)="toggleWishlist($event)"
    [attr.aria-expanded]="!isCollapsed()"
  >
    <app-person-badge
      class="transition-transform duration-150 group-active:scale-95"
      [age]="member().age"
      [tone]="tone()"
    />

    <span class="min-w-0 flex-1">
      <span class="block truncate text-[1.0625rem] font-semibold tracking-snug text-stone-900">
        {{ member().first_name | titlecase }}
      </span>
      <span class="block text-sm font-semibold" [ngClass]="roleTextClass()">
        {{ roleLabel() }}<span class="sr-only">, {{ ageLabel() }}</span>
      </span>
    </span>

    <span class="min-w-[4.75rem] shrink-0 text-right">
      @if (giftCounts().total === 0) {
      <span class="block text-sm text-stone-400">No list yet</span>
      } @else if (!showAdoptionStatus()) {
      <span class="block text-[0.9375rem] font-semibold tabular-nums text-stone-900">
        {{ giftCounts().total }} {{ giftCounts().total === 1 ? "gift" : "gifts" }}
      </span>
      } @else if (allAdopted()) {
      <span class="inline-flex items-center gap-1 rounded-full bg-pine-50 px-2.5 py-1 text-[0.8125rem] font-semibold text-pine-700">
        <i class="pi pi-check text-[0.6875rem]" aria-hidden="true"></i>
        Adopted
      </span>
      } @else {
      <span class="block text-[0.9375rem] font-semibold tabular-nums text-stone-900">
        {{ giftCounts().remaining }} left
      </span>
      <span class="block text-xs tabular-nums text-stone-500">
        of {{ giftCounts().total }} {{ giftCounts().total === 1 ? "gift" : "gifts" }}
      </span>
      }
    </span>

    <i
      class="pi pi-chevron-down shrink-0 text-sm text-stone-400 transition-transform duration-300 ease-out"
      [class.rotate-180]="!isCollapsed()"
      aria-hidden="true"
    ></i>
  </button>

  <div
    class="wishlist grid"
    [class.wishlist-open]="!isCollapsed()"
    [attr.inert]="isCollapsed() ? '' : null"
    (transitionend)="onWishlistTransitionEnd($event)"
  >
    <!-- Padding lives inside the collapsing box; on the box itself it would stay visible when closed -->
    <div class="wishlist-content min-h-0" [class.overflow-hidden]="clipContent()">
      <div class="divide-y divide-stone-100 pb-2 pl-14" [@.disabled]="!animateItems()">
        @for (item of (member().wishlist_items || []); track item.id) {
        <app-wish-item [item]="item" [showAdoptionStatus]="showAdoptionStatus()" @expandCollapse />
        } @empty {
        <p class="py-3 text-sm text-stone-400">
          No wish list items for this family member yet.
        </p>
        }
      </div>
    </div>
  </div>
</div>
