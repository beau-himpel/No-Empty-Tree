<div>
  <button
    type="button"
    class="group flex w-full items-center gap-3 py-4 text-left focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pine-600"
    (click)="toggleWishlist($event)"
    [attr.aria-expanded]="!isCollapsed()"
  >
    <span
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-[0.9375rem] font-semibold transition-transform duration-150 group-active:scale-95"
      [ngClass]="
        member().is_parent
          ? 'bg-pine-100 text-pine-800'
          : member().sex === 'male'
          ? 'bg-sky-100 text-sky-800'
          : member().sex === 'female'
          ? 'bg-rose-100 text-rose-800'
          : 'bg-stone-100 text-stone-600'
      "
      aria-hidden="true"
    >
      {{ (member().first_name | titlecase).charAt(0) }}
    </span>

    <span class="min-w-0 flex-1">
      <span class="block truncate text-base font-semibold tracking-snug text-stone-900">
        {{ member().first_name | titlecase }}
      </span>
      <span class="block text-sm text-stone-500">{{ metaLine() }}</span>
    </span>

    @if (showAdoptionStatus() && allAdopted()) {
    <span
      class="flex shrink-0 items-center gap-1 text-sm font-semibold text-pine-700"
    >
      <i class="pi pi-check-circle text-[0.8125rem]" aria-hidden="true"></i>
      Adopted
    </span>
    }

    <i
      class="pi pi-chevron-down shrink-0 text-sm text-stone-400 transition-transform duration-300 ease-out"
      [class.rotate-180]="!isCollapsed()"
      aria-hidden="true"
    ></i>
  </button>

  <div
    class="wishlist grid"
    [class.wishlist-open]="!isCollapsed()"
    [attr.inert]="isCollapsed() ? '' : null"
    (transitionend)="onWishlistTransitionEnd($event)"
  >
    <div class="wishlist-content min-h-0 pb-2 pl-[3.25rem]" [class.overflow-hidden]="clipContent()">
      <div class="divide-y divide-stone-100" [@.disabled]="!animateItems()">
        @for (item of (member().wishlist_items || []); track item.id) {
        <app-wish-item [item]="item" [showAdoptionStatus]="showAdoptionStatus()" @expandCollapse />
        } @empty {
        <p class="py-3 text-sm text-stone-400">
          No wish list items for this family member yet.
        </p>
        }
      </div>
    </div>
  </div>
</div>
