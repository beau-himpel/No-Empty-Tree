<div class="rounded-2xl border border-stone-200 bg-white">
  <button
    type="button"
    class="flex w-full items-center gap-3 p-4 text-left focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pine-600 rounded-2xl"
    (click)="toggleWishlist($event)"
    [attr.aria-expanded]="!isCollapsed()"
  >
    <span
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-sm font-bold"
      [ngClass]="
        member().is_parent
          ? 'bg-pine-100 text-pine-800'
          : member().sex === 'male'
          ? 'bg-sky-100 text-sky-800'
          : member().sex === 'female'
          ? 'bg-rose-100 text-rose-800'
          : 'bg-stone-100 text-stone-600'
      "
      aria-hidden="true"
    >
      {{ (member().first_name | titlecase).charAt(0) }}
    </span>

    <span class="min-w-0 flex-1">
      <span class="flex flex-wrap items-center gap-x-2 gap-y-1">
        <span class="font-bold text-stone-900">
          {{ member().first_name | titlecase }}
        </span>
        <span [class]="roleChipClass()">{{ roleLabel() }} · {{ member().age }}</span>
        @if (showAllAdoptedMessage() && isAllItemsAdopted(member())) {
        <span class="chip-done">
          <i class="pi pi-check text-[10px]" aria-hidden="true"></i>
          All gifts adopted
        </span>
        }
      </span>
      <span class="mt-0.5 block text-xs text-stone-500">
        @if (giftCounts().total === 0) { No wish list items } @else {
        {{ giftCounts().total }}
        {{ giftCounts().total === 1 ? "gift" : "gifts" }}
        @if (giftCounts().adopted > 0) {
        · {{ giftCounts().adopted }} adopted } }
      </span>
    </span>

    <i
      class="pi shrink-0 text-stone-400 transition-transform"
      [class.pi-chevron-down]="isCollapsed()"
      [class.pi-chevron-up]="!isCollapsed()"
      aria-hidden="true"
    ></i>
  </button>

  <div [@slideDown]="isCollapsed() ? 'collapsed' : 'expanded'">
    <div class="border-t border-stone-100 px-4 pb-2 md:px-5">
      @for (item of (member().wishlist_items || []); track item.id) {
      <app-wish-item
        [item]="item"
        (adoptItem)="adoptItem.emit(item)"
        (unadoptItem)="unadoptItem.emit(item)"
      >
      </app-wish-item>
      @if (!$last) {
      <div class="h-px w-full bg-stone-100"></div>
      } } @empty {
      <p class="py-4 text-sm italic text-stone-400">
        No wish list items for this family member.
      </p>
      }
    </div>
  </div>
</div>
