<div class="item-form-container">
  <!-- Existing Items -->
  @if (existingItems.length > 0) {
  <div class="existing-items">
    <h6>Current Items</h6>
    @for (item of existingItems; track $index; let itemIndex = $index) {
    <div class="existing-item">
      <app-item-info [item]="item" />

      <button
        pButton
        icon="pi pi-trash"
        class="p-button-text !text-red-500"
        (click)="removeExistingItem(itemIndex)"
      ></button>
    </div>
    }
  </div>
  }

  <!-- Single Item Form -->
  <div class="new-item-section">
    <h6>Add New Item</h6>
    <form [formGroup]="itemForm()" class="form-grid">
      <div class="form-field">
        <label for="itemCategory">Category *</label>
        <p-select
          id="itemCategory"
          [options]="itemCategoryOptions"
          formControlName="category"
        >
        </p-select>
      </div>
      <div class="form-field">
        <label for="itemDescription">Description *</label>
        <input pInputText id="itemDescription" formControlName="description" />
      </div>
      <div class="form-field">
        <label for="itemColor">Color</label>
        <input pInputText id="itemColor" formControlName="color" />
      </div>
      <div class="form-field">
        <label for="itemSize">Size</label>
        <input pInputText id="itemSize" formControlName="size" />
      </div>
      <div class="form-field">
        <label for="itemLink">Product Link</label>
        <input pInputText id="itemLink" formControlName="link" />
      </div>
      <div class="form-field">
        <label for="itemDetails">Details</label>
        <textarea
          id="itemDetails"
          formControlName="details"
          rows="3"
          class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        >
        </textarea>
      </div>
    </form>

    <div class="form-actions">
      <button
        class="add-another-btn"
        (click)="addAnotherItem()"
        [disabled]="!isFormValid()"
      >
        <i class="pi pi-plus"></i>
        Add another item
      </button>

      <button class="done-btn" (click)="onDoneAddingItems()">
        <i class="pi pi-check"></i>
        Done adding wishlist items
      </button>
    </div>
  </div>
</div>
