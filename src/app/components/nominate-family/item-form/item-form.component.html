<div [formGroup]="form" class="space-y-5">
  <div>
    <span class="field-label" [id]="uid + '-category'">Category</span>
    <app-choice-group
      variant="chips"
      formControlName="category"
      [options]="categoryOptions"
      [labelledBy]="uid + '-category'"
      [invalid]="showError('category')"
    />
    @if (showError('category')) {
    <p class="field-error"><i class="pi pi-exclamation-circle text-xs" aria-hidden="true"></i>Choose a category</p>
    }
  </div>

  <div>
    <label class="field-label" [for]="uid + '-description'">What's the gift?</label>
    <input
      class="field-input"
      [class.field-input-invalid]="showError('description')"
      [id]="uid + '-description'"
      formControlName="description"
      placeholder="e.g. Warm winter coat"
      autocomplete="off"
      (keydown.enter)="submit()"
    />
    @if (showError('description')) {
    <p class="field-error"><i class="pi pi-exclamation-circle text-xs" aria-hidden="true"></i>Describe the gift</p>
    }
  </div>

  <div class="grid grid-cols-2 gap-3">
    <div>
      <label class="field-label" [for]="uid + '-size'">Size <span class="field-optional">optional</span></label>
      <input class="field-input" [id]="uid + '-size'" formControlName="size" placeholder="e.g. Youth M" autocomplete="off" />
    </div>
    <div>
      <label class="field-label" [for]="uid + '-color'">Color <span class="field-optional">optional</span></label>
      <input class="field-input" [id]="uid + '-color'" formControlName="color" placeholder="e.g. Navy" autocomplete="off" />
    </div>
  </div>

  <div>
    <label class="field-label" [for]="uid + '-link'">Product link <span class="field-optional">optional</span></label>
    <input
      class="field-input"
      [id]="uid + '-link'"
      formControlName="link"
      inputmode="url"
      autocapitalize="off"
      autocomplete="off"
      spellcheck="false"
      placeholder="Paste a link to the exact item"
    />
  </div>

  <div>
    <label class="field-label" [for]="uid + '-details'">Notes for the adopter <span class="field-optional">optional</span></label>
    <textarea
      class="field-input min-h-[5.5rem] resize-y"
      [id]="uid + '-details'"
      formControlName="details"
      rows="3"
      placeholder="Favorite colors, brands, anything that helps"
    ></textarea>
  </div>

  <div class="flex flex-col gap-2 sm:flex-row">
    <button type="button" class="btn-dark w-full sm:w-auto" (click)="submit()">
      <i class="pi pi-plus text-xs" aria-hidden="true"></i>
      Add to wish list
    </button>
    @if (canCancel()) {
    <button type="button" class="btn-quiet w-full sm:w-auto" (click)="cancel()">Cancel</button>
    }
  </div>
</div>
