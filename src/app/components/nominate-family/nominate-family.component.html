<div class="nominate-container">
  <div class="flex justify-between items-center mb-10">
    <h3>Family Information</h3>
    <p-button 
      label="Submit Family" 
      icon="pi pi-save" 
      iconPos="right"
      size="large"
      (click)="saveFamily()"
      [disabled]="!isFamilyValid()">
    </p-button>
  </div>
  
  <p-card styleClass="nomination-card">
    <div class="form-container">
      <div class="family-info-section">
        <form [formGroup]="familyForm" class="form-grid">
          <div class="form-field">
            <label for="familyName">Family Name *</label>
            <input pInputText id="familyName" formControlName="name" type="text" />
          </div>
          <div class="form-field">
            <label for="address">Address *</label>
            <input pInputText id="address" formControlName="address" type="text" />
          </div>
          <div class="form-field">
            <label for="phone">Phone Number</label>
            <input pInputText id="phone" formControlName="phone" type="text" />
          </div>
          <div class="form-field">
            <label for="email">Email *</label>
            <input pInputText id="email" formControlName="email" type="email" />
          </div>
        </form>
      </div>

      <div class="family-members-section">
        <div class="section-header">
          <h3>Family Members</h3>
          <p-button 
            label="Add Family Member" 
            icon="pi pi-plus"
            iconPos="right"
            styleClass="outlined-button"
            (click)="addFamilyMember()">
          </p-button>
        </div>

        <p-accordion [value]="0">
            @for (member of familyInfo().members; track $index; let i = $index) {

              <p-accordion-panel [value]="i">
                  <p-accordion-header>{{ member.name }}</p-accordion-header>
                  <p-accordion-content>
                    <app-family-member
                    [member]="member"
                    [isCurrentMember]="member.id === currentMember().id"
                    [isAddingMember]="isAddingMember()"
                    [editingMemberIndex]="editingMemberIndex()"
                    [memberIndex]="i"
                    (memberSelected)="editMember(i)"
                    (memberRemoved)="removeMember(i)"
                    (memberUpdated)="onMemberUpdated($event)"
                    (flipCard)="onFlipCardFromDetails()"
                    (itemsSaved)="onItemsSaved($event)"
                    (itemsUpdated)="onItemsUpdated($event)">
                  </app-family-member>
                  </p-accordion-content>
              </p-accordion-panel>
          }
      </p-accordion>
  
      </div>
    </div>
  </p-card>
</div>
