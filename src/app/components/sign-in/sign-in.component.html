<div class="flex justify-center items-center min-h-screen p-8 md:p-4">
  <p-card header="No Empty Tree" class="w-full max-w-md shadow-2xl rounded-2xl border-0 bg-white/95 backdrop-blur-sm">
    <div class="flex flex-col gap-6 p-2">
      <form (ngSubmit)="signInWithEmail()" class="flex flex-col gap-5">
        <div class="flex flex-col gap-2">
          <label for="email" class="font-semibold text-slate-700 text-sm">Email</label>
          <input 
            id="email"
            type="email" 
            pInputText 
            [ngModel]="email()" 
            (ngModelChange)="email.set($event)"
            name="email"
            class="rounded-lg border-2 border-slate-200 px-4 py-3 text-base transition-all duration-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
            required>
        </div>

        <div class="flex flex-col gap-2">
          <label for="password" class="font-semibold text-slate-700 text-sm">Password</label>
          <p-password 
            id="password"
            [ngModel]="password()" 
            (ngModelChange)="password.set($event)"
            name="password"
            [feedback]="false"
            class="w-full"
            required>
          </p-password>
        </div>

        <div class="mt-2">
          <p-button 
            [label]="isSignUp() ? 'Sign Up' : 'Sign In'"
            type="submit"
            [loading]="isLoading()"
            class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 border-0 rounded-xl px-5 py-3.5 font-semibold text-base text-white transition-all duration-300 shadow-lg hover:shadow-xl hover:-translate-y-0.5">
          </p-button>
        </div>

        <div class="text-center mt-4">
          <button 
            type="button" 
            class="bg-none border-none text-indigo-600 cursor-pointer text-sm font-medium transition-colors duration-200 hover:text-indigo-800 hover:underline"
            (click)="toggleSignUp()">
            {{ isSignUp() ? 'Already have an account? Sign In' : "Don't have an account? Sign Up" }}
          </button>
        </div>
      </form>

      <div class="text-center relative text-slate-500 text-sm font-medium my-2">
        <span class="bg-white/95 px-5 relative z-10">or</span>
        <div class="absolute top-1/2 left-0 right-0 h-px bg-gradient-to-r from-transparent via-slate-200 to-transparent z-0"></div>
      </div>

      <div class="w-full">
        <p-button 
          label="Sign in with Google" 
          icon="pi pi-google"
          [loading]="isLoading()"
          (click)="signInWithGoogle()"
          class="w-full bg-gradient-to-r from-blue-500 via-green-500 via-yellow-500 to-red-500 border-0 rounded-xl px-5 py-3 font-semibold text-base text-white transition-all duration-300 shadow-lg hover:shadow-xl hover:-translate-y-0.5">
        </p-button>
      </div>
    </div>
  </p-card>
</div>
