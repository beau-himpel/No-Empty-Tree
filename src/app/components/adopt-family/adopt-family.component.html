<div class="max-w-6xl mx-auto p-8 md:p-4">
  <p-card header="Adopt a Family" class="shadow-lg rounded-xl">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (family of availableFamilies(); track family.id) {
        <div class="border border-slate-200 rounded-lg p-6 bg-white hover:shadow-md transition-shadow duration-200 cursor-pointer hover:border-indigo-300"
             (click)="viewFamilyDetails(family)">
          <div class="mb-4">
            <h3 class="text-xl font-semibold text-slate-700 mb-3">{{ family.name }}</h3>
            <div class="flex gap-4 text-sm">
              <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full font-medium">{{ getFamilyCounts(family.id).adultCount }} Adults</span>
              <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full font-medium">{{ getFamilyCounts(family.id).childCount }} Children</span>
            </div>
          </div>
          <div class="text-center">
            <span class="text-slate-500 text-sm">Click to view details</span>
          </div>
        </div>
      } @empty {
        <div class="col-span-full text-center py-12">
          <p class="text-slate-500 text-lg mb-6">No families available for adoption at this time.</p>
          <p-button 
            label="Nominate a Family" 
            icon="pi pi-plus" 
            (click)="navigateToNominate()">
          </p-button>
        </div>
      }
    </div>
  </p-card>
</div>

<!-- Family Details Component -->
@if (selectedFamily()) {
  <app-family-details 
    [family]="selectedFamily()" 
    [currentUser]="currentUser()"
    (closeRequested)="onFamilyDetailsClose()">
  </app-family-details>
}
