<p-dialog
  header="Confirm removing family member"
  [(visible)]="visible"
  [modal]="true"
  [closable]="false"
  [style]="{ width: '450px' }"
  [draggable]="false"
  [resizable]="false"
>
  <div class="confirmation-content">
    <p>
      Are you sure you want to delete {{ memberName || 'this family member' }} and all associated wish
      list items?
    </p>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex justify-end gap-8">
      <button class="cancel-btn" (click)="onCancel()">Cancel</button>
      <button class="confirm-btn" (click)="onConfirm()">
        <div class="flex items-center gap-4">
          <span>Delete</span>
          <i class="pi pi-heart-fill"></i>
        </div>
      </button>
    </div>
  </ng-template>
</p-dialog>
