<div class="flex justify-center items-center min-h-screen p-8 md:p-4">
  <div
    class="flex flex-col lg:flex-row items-center lg:items-start gap-16 lg:gap-28 w-full max-w-4xl"
  >
    <div class="text-center lg:text-left">
      <h1
        class="text-6xl md:text-7xl lg:text-10xl font-bold bg-gradient-to-r from-indigo-500 to-purple-600 bg-clip-text text-transparent mb-4"
      >
        No Empty Tree
      </h1>
      <p
        class="text-sm md:text-base text-slate-400 font-medium text-center md:mt-6 lg:mt-8"
      >
        Bringing families together for the holidays
      </p>
    </div>

    <div class="w-full max-w-md">
      @if (isLoading()) {
        <div class="flex flex-col items-center justify-center py-12">
          <div
            class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-500 mb-4"
          ></div>
          <p class="text-slate-600 font-medium">Creating your account...</p>
        </div>
      } @else {
        <div class="flex flex-col gap-6 p-2">
          <form (ngSubmit)="signUpWithEmail()" class="flex flex-col gap-5">
            <div class="flex flex-col gap-2">
              <label for="name" class="font-semibold text-slate-700 text-sm"
                >Name</label
              >
              <input
                id="name"
                type="text"
                pInputText
                [ngModel]="name()"
                (ngModelChange)="name.set($event)"
                name="name"
                class="rounded-lg border-2 border-slate-200 px-4 py-3 text-base transition-all duration-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
                required
              />
            </div>

            <div class="flex flex-col gap-2">
              <label for="email" class="font-semibold text-slate-700 text-sm"
                >Email</label
              >
              <input
                id="email"
                type="email"
                pInputText
                [ngModel]="email()"
                (ngModelChange)="email.set($event)"
                name="email"
                class="rounded-lg border-2 border-slate-200 px-4 py-3 text-base transition-all duration-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
                required
              />
            </div>

            <div class="flex flex-col gap-2">
              <label for="password" class="font-semibold text-slate-700 text-sm"
                >Password</label
              >
              <p-password
                id="password"
                [ngModel]="password()"
                (ngModelChange)="password.set($event)"
                name="password"
                [feedback]="false"
                class="w-full"
                required
              >
              </p-password>
            </div>

            <div class="mt-2">
              <button
                type="submit"
                class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 border-0 rounded-xl px-5 py-3.5 font-semibold text-base text-white transition-all duration-300 shadow-lg hover:shadow-xl hover:-translate-y-0.5"
              >
                Create Account
              </button>
            </div>

            <div class="text-center mt-4">
              <button
                type="button"
                class="bg-none border-none text-indigo-600 cursor-pointer text-sm font-medium transition-colors duration-200 hover:text-indigo-800 hover:underline"
                (click)="goToSignIn()"
              >
                Already have an account? Sign In
              </button>
            </div>
          </form>

          <div
            class="text-center relative text-slate-500 text-sm font-medium my-2"
          >
            <span class="bg-white/95 px-5 relative z-10">or</span>
            <div
              class="absolute top-1/2 left-0 right-0 h-px bg-gradient-to-r from-slate-200 via-slate-300 to-slate-200 z-0"
            ></div>
          </div>

          <div class="w-full">
            <button
              type="button"
              [disabled]="isLoading()"
              (click)="signUpWithGoogle()"
              class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-lg px-4 py-3 text-sm font-medium text-gray-700 hover:bg-gray-50 hover:border-gray-400 transition-all duration-200 shadow-sm hover:shadow-md"
            >
              <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path
                  fill="#4285F4"
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                />
                <path
                  fill="#34A853"
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                />
                <path
                  fill="#FBBC05"
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                />
                <path
                  fill="#EA4335"
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                />
              </svg>
              <span>Continue with Google</span>
            </button>
          </div>

          @if (errorMessage()) {
            <div class="error-message">
              {{ errorMessage() }}
            </div>
          }
        </div>
      }
    </div>
  </div>
</div>
