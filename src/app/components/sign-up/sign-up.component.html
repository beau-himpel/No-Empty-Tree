<div class="w-full max-w-md">
  @if (hasSignedUp()) {
  <div class="flex flex-col items-center justify-center gap-8 py-12">
    <p class="text-slate-600 font-medium">Check your email for a confirmation link!</p>
    <button
      class="bg-red-500 hover:bg-red-600 text-white font-medium py-2 px-4 rounded-lg flex items-center gap-2 transition-colors"
      (click)="navigateToSignIn()">
      <div class="flex items-center gap-4">
        <span>Back to sign in</span>
      </div>
    </button>
  </div>
  } @else {
  @if (isLoading()) {
  <div class="flex flex-col items-center justify-center py-12">
    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-500 mb-4"></div>
    <p class="text-slate-600 font-medium">Creating your account...</p>
  </div>
  } @else {
  <div class="flex flex-col gap-6 p-2">
    <form (ngSubmit)="signUpWithEmail()" class="flex flex-col gap-5">
      <div class="flex flex-col gap-2">
        <label for="name" class="font-semibold text-slate-700 text-sm">Name</label>
        <input id="name" autocomplete="given-name" type="text" pInputText [ngModel]="name()"
          (ngModelChange)="name.set($event)" name="name"
          class="rounded-lg border-2 border-slate-200 px-4 py-3 text-base transition-all duration-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
          required />
      </div>

      <div class="flex flex-col gap-2">
        <label for="email" class="font-semibold text-slate-700 text-sm">Email</label>
        <input id="email" type="email" autocomplete="email" pInputText [ngModel]="email()"
          (ngModelChange)="email.set($event)" name="email"
          class="rounded-lg border-2 border-slate-200 px-4 py-3 text-base transition-all duration-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
          required />
      </div>

      <div class="flex flex-col gap-2">
        <label for="password" class="font-semibold text-slate-700 text-sm">Password</label>
        <input id="password" type="password" autocomplete="new-password" pInputText [ngModel]="password()"
          (ngModelChange)="password.set($event)" name="password"
          class="rounded-lg border-2 border-slate-200 px-4 py-3 text-base transition-all duration-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
          required />
      </div>

      <div class="mt-2">
        <button type="submit"
          class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 border-0 rounded-xl px-5 py-3.5 font-semibold text-base text-white transition-all duration-300 shadow-lg hover:shadow-xl hover:-translate-y-0.5">
          Create account
        </button>
      </div>
    </form>

    @if (errorMessage()) {
    <div class="error-message">
      {{ errorMessage() }}
    </div>
    }
  </div>
  }
  }
</div>
