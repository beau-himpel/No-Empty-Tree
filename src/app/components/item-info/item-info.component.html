<p class="text-sm text-stone-500">{{ item().category }}</p>
<p
  class="mt-0.5 text-[0.9375rem] font-semibold leading-snug tracking-snug transition-colors"
  [class.text-stone-900]="!muted()"
  [class.text-stone-400]="muted()"
>
  {{ item().description }}
</p>
@if (metaLine()) {
<p class="mt-0.5 text-sm text-stone-500">{{ metaLine() }}</p>
} @if (item().details) {
<p class="mt-1 text-sm leading-relaxed text-stone-500">{{ item().details }}</p>
} @if (item().link) {
<a
  [href]="item().link"
  target="_blank"
  rel="noopener noreferrer"
  class="mt-1.5 inline-flex items-center gap-1 text-sm font-semibold text-pine-700 hover:text-pine-800 hover:underline"
>
  View item
  <i class="pi pi-arrow-up-right text-[0.6875rem]" aria-hidden="true"></i>
</a>
}
