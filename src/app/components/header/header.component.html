<!-- Top bar -->
<header
  class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-stone-200"
>
  <div
    class="mx-auto flex h-16 w-full max-w-6xl items-center justify-between px-4 md:px-8"
  >
    <a
      routerLink="/adopt-family"
      class="flex items-center gap-2.5 no-underline"
      aria-label="No Empty Tree home"
    >
      <svg
        viewBox="0 0 24 24"
        class="h-8 w-8 text-pine-700"
        fill="currentColor"
        aria-hidden="true"
      >
        <path d="M12 1.5 16.2 8H7.8L12 1.5Z" />
        <path d="M12 6 17.6 14.2H6.4L12 6Z" />
        <path d="M12 11 19 20H5L12 11Z" />
        <rect x="10.75" y="20" width="2.5" height="2.5" rx="0.5" />
      </svg>
      <span
        class="text-lg font-bold tracking-tight text-pine-800 whitespace-nowrap"
      >
        No Empty Tree
      </span>
    </a>

    <!-- Desktop navigation -->
    <nav class="hidden md:flex items-center gap-1">
      <a routerLink="/adopt-family" routerLinkActive="nav-link-active" class="nav-link">
        Adopt Families
      </a>
      @if (nominationsEnabled()) {
      <a routerLink="/nominate-family" routerLinkActive="nav-link-active" class="nav-link">
        Nominate Family
      </a>
      }
      <a routerLink="/my-adoptions" routerLinkActive="nav-link-active" class="nav-link">
        My Adoptions
      </a>
      <button
        type="button"
        class="nav-link ml-2 !text-berry-700 hover:!bg-berry-50"
        (click)="logout()"
      >
        Log out
      </button>
    </nav>

    <!-- Mobile: log out lives in the top bar; navigation is the bottom tab bar -->
    <button
      type="button"
      class="md:hidden flex items-center gap-1.5 rounded-lg px-3 py-2 text-sm font-medium text-stone-500 hover:bg-stone-100 hover:text-stone-700"
      (click)="logout()"
      aria-label="Log out"
    >
      <i class="pi pi-sign-out text-base" aria-hidden="true"></i>
      <span>Log out</span>
    </button>
  </div>
</header>

<!-- Mobile bottom tab bar -->
<nav
  class="fixed inset-x-0 bottom-0 z-40 border-t border-stone-200 bg-white/95 backdrop-blur md:hidden"
  style="padding-bottom: env(safe-area-inset-bottom)"
  aria-label="Primary"
>
  <div class="grid auto-cols-fr grid-flow-col">
    <a routerLink="/adopt-family" routerLinkActive="tab-active" class="tab">
      <i class="pi pi-gift text-xl" aria-hidden="true"></i>
      <span>Families</span>
    </a>
    @if (nominationsEnabled()) {
    <a routerLink="/nominate-family" routerLinkActive="tab-active" class="tab">
      <i class="pi pi-plus-circle text-xl" aria-hidden="true"></i>
      <span>Nominate</span>
    </a>
    }
    <a routerLink="/my-adoptions" routerLinkActive="tab-active" class="tab">
      <i class="pi pi-heart text-xl" aria-hidden="true"></i>
      <span>My Adoptions</span>
    </a>
  </div>
</nav>
